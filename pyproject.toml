[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judgment-base-agent"
version = "0.1.0"
description = "Model-agnostic System One / Calibrated Judgment primitives for Google ADK workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.7.0",
    "typesafe-sdk>=0.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["judgment_base_agent", "jev_base_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
